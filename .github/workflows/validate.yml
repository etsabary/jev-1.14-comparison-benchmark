name: Validate frozen benchmark evidence
on: [push, pull_request, workflow_dispatch]
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 validate.py
      - run: python3 text_models.py
      - run: python3 matched_analysis.py
      - run: python3 overall_analysis.py
      - run: python3 -m unittest -v test_analysis.py test_text_models.py test_decision_refresh.py test_added_decisions.py test_overall.py test_publication.py test_matched.py
